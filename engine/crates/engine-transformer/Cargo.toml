[package]
name = "personalai-engine-transformer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Validated transformer plans and backend boundaries for the PersonalAI native engine"

[features]
default = ["cpu-reference"]
cpu-reference = [
    "dep:personalai-engine-cpu-reference",
    "dep:personalai-engine-loader",
    "dep:personalai-engine-placement",
]
arm64 = ["dep:personalai-engine-arm64"]
metal = ["dep:personalai-engine-metal"]
cuda = []

[dependencies]
personalai-engine-cpu-reference = { workspace = true, optional = true }
personalai-engine-loader = { workspace = true, optional = true }
personalai-engine-placement = { workspace = true, optional = true }
personalai-engine-arm64 = { workspace = true, optional = true }
personalai-engine-metal = { workspace = true, optional = true }
personalai-engine-kv-cache.workspace = true
personalai-engine-knowledge-contract.workspace = true
personalai-engine-memory.workspace = true
personalai-engine-model-format.workspace = true
personalai-engine-tensor.workspace = true
personalai-engine-types.workspace = true

[dev-dependencies]
personalai-engine-crypto.workspace = true
personalai-engine-model-importer.workspace = true
personalai-engine-quantization.workspace = true
personalai-engine-testkit.workspace = true

[lints]
workspace = true
