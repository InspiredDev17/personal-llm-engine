[package]
name = "personalai-engine-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Owner-facing diagnostic CLI for the PersonalAI native engine foundation"

[features]
default = ["cpu-reference"]
cpu-reference = ["personalai-engine-server/cpu-reference"]
metal = ["cpu-reference", "personalai-engine-server/metal"]

[[bin]]
name = "personalai-engine"
path = "src/main.rs"

[dependencies]
libc.workspace = true
personalai-engine-crypto.workspace = true
personalai-engine-scheduler.workspace = true
personalai-engine-sampling.workspace = true
personalai-engine-server = { workspace = true, default-features = false }
personalai-engine-types.workspace = true

[lints]
workspace = true
