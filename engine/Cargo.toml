[workspace]
members = [
    "crates/engine-types",
    "crates/engine-crypto",
    "crates/engine-release",
    "crates/engine-model-format",
    "crates/engine-quantization",
    "crates/engine-model-importer",
    "crates/engine-loader",
    "crates/engine-knowledge-contract",
    "crates/engine-placement",
    "crates/engine-tokenizer",
    "crates/engine-tensor",
    "crates/engine-cpu-reference",
    "crates/engine-arm64",
    "crates/engine-metal",
    "crates/engine-memory",
    "crates/engine-kv-cache",
    "crates/engine-transformer",
    "crates/engine-sampling",
    "crates/engine-scheduler",
    "crates/engine-protocol",
    "crates/engine-server",
    "crates/engine-cli",
    "crates/engine-testkit",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
personalai-engine-types = { path = "crates/engine-types" }
personalai-engine-crypto = { path = "crates/engine-crypto" }
personalai-engine-release = { path = "crates/engine-release" }
personalai-engine-model-format = { path = "crates/engine-model-format" }
personalai-engine-quantization = { path = "crates/engine-quantization" }
personalai-engine-model-importer = { path = "crates/engine-model-importer" }
personalai-engine-loader = { path = "crates/engine-loader" }
personalai-engine-knowledge-contract = { path = "crates/engine-knowledge-contract" }
personalai-engine-placement = { path = "crates/engine-placement" }
personalai-engine-tokenizer = { path = "crates/engine-tokenizer" }
personalai-engine-tensor = { path = "crates/engine-tensor" }
personalai-engine-cpu-reference = { path = "crates/engine-cpu-reference" }
personalai-engine-arm64 = { path = "crates/engine-arm64" }
personalai-engine-metal = { path = "crates/engine-metal" }
personalai-engine-memory = { path = "crates/engine-memory" }
personalai-engine-kv-cache = { path = "crates/engine-kv-cache" }
personalai-engine-transformer = { path = "crates/engine-transformer", default-features = false }
personalai-engine-sampling = { path = "crates/engine-sampling" }
personalai-engine-scheduler = { path = "crates/engine-scheduler" }
personalai-engine-protocol = { path = "crates/engine-protocol" }
personalai-engine-server = { path = "crates/engine-server", default-features = false }
personalai-engine-testkit = { path = "crates/engine-testkit" }
sovereign-ai-contracts = { git = "https://github.com/InspiredDev17/Sovereign-AI-Contracts.git", rev = "2c4a7a6afd5625e7def3afec26f18fedac343d11", default-features = false, features = ["runtime-v3"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.11.0", default-features = false }
libc = { version = "=0.2.189", default-features = false }
unicode-general-category = { version = "=1.1.0", default-features = false }
unicode-normalization = { version = "=0.1.24", default-features = false }
zeroize = { version = "=1.8.2", default-features = false }

[workspace.lints.rust]
warnings = { level = "deny", priority = -2 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_field_names = "allow"
doc_markdown = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
panic = "abort"
strip = "symbols"

[workspace.metadata.native-engine]
dependency-policy = "../docs/native-engine/DEPENDENCY-POLICY.md"
model-package-policy = "../docs/native-engine/MODEL-SUPPLY-CHAIN.md"
