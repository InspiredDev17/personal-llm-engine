name: native-engine-verify

on:
  push:
    branches:
      - main
      - agent/native-inference-engine
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-engine-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-workspace:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.85.0 --profile minimal
          --component clippy --component rustfmt
      - name: Verify formatting
        working-directory: engine
        run: cargo +1.85.0 fmt --all --check
      - name: Verify locked metadata
        working-directory: engine
        run: cargo +1.85.0 metadata --format-version 1 --locked --offline --no-deps > /dev/null
      - name: Review resolved feature graph
        working-directory: engine
        run: cargo +1.85.0 tree --workspace --all-features --locked --offline -e features
      - name: Check every target and feature
        working-directory: engine
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked --offline
      - name: Build every target and feature
        working-directory: engine
        run: cargo +1.85.0 build --workspace --all-targets --all-features --locked --offline
      - name: Deny Clippy warnings
        working-directory: engine
        run: >-
          cargo +1.85.0 clippy --workspace --all-targets --all-features
          --locked --offline -- -D warnings
      - name: Run workspace tests
        working-directory: engine
        run: cargo +1.85.0 test --workspace --all-targets --all-features --locked --offline
      - name: Run documentation tests
        working-directory: engine
        run: cargo +1.85.0 test --workspace --doc --all-features --locked --offline
      - name: Build documentation
        working-directory: engine
        run: cargo +1.85.0 doc --workspace --all-features --no-deps --locked --offline
      - name: Verify disabled backend profile
        working-directory: engine
        run: >-
          cargo +1.85.0 check --workspace --all-targets --no-default-features
          --locked --offline
      - name: Reject generated repository changes
        run: git diff --exit-code
